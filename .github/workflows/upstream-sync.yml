name: Upstream sync

# Fork-owned workflow. Reconstructs this fork on top of the current upstream and
# opens a pull request, so every upstream change is reviewed as a diff before it
# reaches main. See FORK.md.
#
# This deliberately does not use `git merge upstream/main`. The repository
# ruleset allows squash merges only, so a merged sync pull request leaves no
# commit with upstream as a parent. Git then still sees the original fork point
# as the merge base and replays the entire upstream history on the next sync,
# which conflicts on every file both sides touched. Rebuilding the tree from
# upstream instead does not depend on ancestry at all and cannot conflict.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM: https://github.com/Softeria/ms-365-mcp-server.git
  SYNC_BRANCH: sync/upstream
  # Everything this fork owns. Anything not listed here comes from upstream
  # verbatim. Keep in step with the table in FORK.md.
  FORK_PATHS: >-
    FORK.md
    .fork
    .github/workflows/docker.yml
    .github/workflows/codeql.yml
    .github/workflows/upstream-sync.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT lets the resulting PR trigger the other workflows. With the
          # default GITHUB_TOKEN the PR is still opened, but its checks only run
          # once it is merged into main.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch upstream main --tags --force

      - name: Rebuild the fork on top of upstream
        id: sync
        run: |
          # Lists differences between two refs that are not plain additions,
          # ignoring anything the fork owns. Runs git into a file rather than a
          # pipe so a git failure trips `set -e` instead of being swallowed by
          # the `|| true` that grep would otherwise need.
          non_additive() {
            git diff --name-status "$1" "$2" > /tmp/diff.txt
            awk -v paths="$FORK_PATHS" '
              BEGIN { n = split(paths, own, " ") }
              $1 == "A" { next }
              {
                for (i = 1; i <= n; i++)
                  if ($2 == own[i] || index($2, own[i] "/") == 1) next
                print
              }
            ' /tmp/diff.txt
          }

          PREVIOUS=$(tr -d '[:space:]' < .fork/upstream-version)
          if ! git rev-parse -q --verify "v$PREVIOUS^{commit}" > /dev/null; then
            echo "::error::Pinned upstream tag v$PREVIOUS does not exist. Was .fork/upstream-version edited by hand?"
            exit 1
          fi

          VERSION=$(git describe --tags --abbrev=0 upstream/main | sed 's/^v//')
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Unexpected upstream version '$VERSION'" && exit 1 ;;
          esac

          # main must be the pinned upstream release plus fork-owned files and
          # nothing else. If it is not, someone edited a file upstream owns, and
          # rebuilding from upstream would silently discard that edit.
          DRIFT=$(non_additive "v$PREVIOUS" origin/main)
          if [ -n "$DRIFT" ]; then
            echo "::error::main differs from upstream v$PREVIOUS in files upstream owns. Rebuilding would discard those edits. Either revert them or add the files to FORK_PATHS. See FORK.md."
            echo "$DRIFT"
            exit 1
          fi

          git checkout -B "$SYNC_BRANCH" origin/main
          # Working tree becomes upstream's exactly, including deletions.
          git read-tree -u --reset upstream/main
          # Then put the fork's own files back on top.
          git checkout origin/main -- $FORK_PATHS
          printf '%s\n' "$VERSION" > .fork/upstream-version
          git add -A

          # No file may vanish except one upstream itself deleted. Since the
          # drift check above established that main is the pinned upstream
          # release plus fork-owned files, whatever is left after subtracting
          # upstream's own deletions is a fork-owned file that FORK_PATHS failed
          # to restore. Listing FORK_PATHS on both sides instead would be
          # circular: a path missing from that list would never be looked at.
          # The staged tree is used because nothing is committed yet.
          STAGED=$(git write-tree)
          git ls-tree -r --name-only origin/main | sort > /tmp/before.txt
          git ls-tree -r --name-only "$STAGED" | sort > /tmp/after.txt
          git ls-tree -r --name-only "v$PREVIOUS" | sort > /tmp/pinned.txt
          git ls-tree -r --name-only upstream/main | sort > /tmp/current.txt
          comm -23 /tmp/before.txt /tmp/after.txt > /tmp/vanished.txt
          comm -23 /tmp/pinned.txt /tmp/current.txt > /tmp/upstream-deleted.txt
          MISSING=$(comm -23 /tmp/vanished.txt /tmp/upstream-deleted.txt)
          if [ -n "$MISSING" ]; then
            echo "::error::The rebuild dropped files upstream did not delete. FORK_PATHS in this workflow is out of date."
            echo "$MISSING"
            exit 1
          fi

          if git diff --cached --quiet origin/main; then
            echo "Already identical to upstream $VERSION, nothing to sync"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -q -m "chore(fork): sync upstream $VERSION

          Rebuilt from Softeria/ms-365-mcp-server at v$VERSION, keeping the
          fork-owned files. Previously pinned to $PREVIOUS."

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.sync.outputs.changed == 'true'
        run: git push --force origin "$SYNC_BRANCH"

      - name: Open or update pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.sync.outputs.version }}
          PREVIOUS: ${{ steps.sync.outputs.previous }}
        run: |
          BODY=$(cat <<EOF
          Rebuilt from \`Softeria/ms-365-mcp-server\` at \`v$VERSION\`, keeping the
          fork-owned files listed in FORK.md.

          Upstream version: \`$PREVIOUS\` -> \`$VERSION\`

          The diff below is exactly what changed upstream. Review it, then merge.
          The Docker workflow then builds the image, runs \`npm audit --omit=dev\`,
          scans it with Trivy and pushes it to GHCR as \`$VERSION\`. CodeQL
          analyses the source separately.
          EOF
          )
          if [ -n "$(gh pr list --head "$SYNC_BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr edit "$SYNC_BRANCH" \
              --title "chore(fork): sync upstream $VERSION" --body "$BODY"
            exit 0
          fi

          if gh pr create --base main --head "$SYNC_BRANCH" \
               --title "chore(fork): sync upstream $VERSION" --body "$BODY" 2> /tmp/pr-error.txt; then
            exit 0
          fi
          cat /tmp/pr-error.txt

          # GitHub refuses pull request creation by GITHUB_TOKEN unless the
          # repository enables "Allow GitHub Actions to create and approve pull
          # requests", which needs admin. The branch is pushed either way, so
          # hand over a link rather than just failing. Setting an
          # UPSTREAM_SYNC_TOKEN secret removes this entirely; see FORK.md.
          if grep -q 'not accessible by integration' /tmp/pr-error.txt; then
            COMPARE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$SYNC_BRANCH?expand=1"
            {
              echo "## Upstream sync $VERSION is ready"
              echo
              echo "Branch \`$SYNC_BRANCH\` is pushed and holds upstream \`$VERSION\`."
              echo "GitHub Actions may not open the pull request in this repository, so open it here:"
              echo
              echo "$COMPARE"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Actions may not create pull requests here. Branch $SYNC_BRANCH is pushed and ready: $COMPARE  Set an UPSTREAM_SYNC_TOKEN secret to remove this step, see FORK.md."
          fi
          exit 1
