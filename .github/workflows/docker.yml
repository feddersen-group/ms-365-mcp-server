name: Docker

# Fork-owned workflow. Upstream does not ship this file, so it never conflicts
# on an upstream sync. See FORK.md.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ms-365-mcp-server
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # Replaces upstream's build.yml, which is disabled here. That workflow runs the
  # same checks across Node 18, 20 and 22 because upstream publishes an npm
  # package with engines >=18. This fork only ever ships a container on Node 24,
  # so three quarters of that matrix tested a runtime we never deploy.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Upstream's own script: generate, lint, format:check, typecheck, build,
      # test. Calling it rather than restating the list keeps this in step with
      # upstream when they change what verifying means.
      - run: npm run verify

      # Gate on what actually ships. The release stage installs with --omit=dev,
      # so dev-only advisories cannot reach the image and must not block the
      # build. The full audit runs alongside as a report.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (report only)
        if: always()
        run: |
          {
            echo '## npm audit (including dev dependencies)'
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Only amd64 is scanned. It is the same application on both architectures,
  # built from the same package versions, so an arm64 scan would re-report the
  # same advisories. arm64 is still built and published below.
  scan:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build
        id: prep
        run: |
          VERSION=$(tr -d '[:space:]' < .fork/upstream-version)
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Not a version: '$VERSION'" && exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Upstream leaves package.json at 0.0.0-development and lets
      # semantic-release fill it in at release time. We do not run
      # semantic-release, so without this the container would report
      # 0.0.0-development while its image tag says otherwise. src/version.ts
      # reads package.json at runtime and the release stage copies it in.
      # This only ever touches the CI workspace, never a commit.
      - name: Stamp the upstream version into package.json and the lockfile
        env:
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.tmp
          mv package.tmp package.json
          jq --arg v "$VERSION" '.version = $v | .packages[""].version = $v' \
            package-lock.json > lock.tmp
          mv lock.tmp package-lock.json

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Trivy scan (report to Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true

      # Skipped for fork pull requests, which get a read-only token and cannot
      # write security events.
      - name: Upload Trivy results
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Fail on fixable CRITICAL findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # Only runs once the scan passed, so an image that failed the gate never
  # reaches the registry. amd64 comes from the buildx cache the scan job left
  # behind; arm64 is built here, which is the bulk of this job's time.
  push:
    needs: scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned upstream version
        id: upstream
        run: |
          VERSION=$(tr -d '[:space:]' < .fork/upstream-version)
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Not a version: '$VERSION'" && exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp the upstream version into package.json and the lockfile
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.tmp
          mv package.tmp package.json
          jq --arg v "$VERSION" '.version = $v | .packages[""].version = $v' \
            package-lock.json > lock.tmp
          mv lock.tmp package-lock.json

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.upstream.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
