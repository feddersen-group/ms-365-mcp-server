name: Docker

# Fork-owned workflow. Upstream does not ship this file, so it never conflicts
# on an upstream sync. See FORK.md.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ms-365-mcp-server
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # Replaces upstream's build.yml, which is disabled here. That workflow runs the
  # same checks across Node 18, 20 and 22 because upstream publishes an npm
  # package with engines >=18. This fork only ever ships a container on Node 24,
  # so three quarters of that matrix tested a runtime we never deploy.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Gate on what actually ships. The release stage installs with --omit=dev,
      # so dev-only advisories cannot reach the image and must not block the
      # build. The full audit runs alongside as a report.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (report only)
        if: always()
        run: |
          {
            echo '## npm audit (including dev dependencies)'
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # One job per platform so both architectures are scanned before anything is
  # pushed. buildx can only load a single platform into the daemon at a time,
  # which is why this is a matrix rather than one multi-platform build.
  scan:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build
        id: prep
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          VERSION=$(tr -d '[:space:]' < .fork/upstream-version)
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Not a version: '$VERSION'" && exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM##*/}" >> "$GITHUB_OUTPUT"

      # Upstream leaves package.json at 0.0.0-development and lets
      # semantic-release fill it in at release time. We do not run
      # semantic-release, so without this the container would report
      # 0.0.0-development while its image tag says otherwise. src/version.ts
      # reads package.json at runtime and the release stage copies it in.
      # This only ever touches the CI workspace, never a commit.
      - name: Stamp the upstream version into package.json and the lockfile
        env:
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.tmp
          mv package.tmp package.json
          jq --arg v "$VERSION" '.version = $v | .packages[""].version = $v' \
            package-lock.json > lock.tmp
          mv lock.tmp package-lock.json

      - uses: docker/setup-qemu-action@v3
        if: matrix.platform != 'linux/amd64'

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.platform }} for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE }}:scan-${{ steps.prep.outputs.arch }}
          cache-from: type=gha,scope=${{ steps.prep.outputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.arch }}

      # SARIF is uploaded from one platform only. The findings are the same
      # packages on both, and uploading twice would double every alert in the
      # Security tab. Both platforms are still gated below.
      - name: Trivy scan (report to Security tab)
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan-${{ steps.prep.outputs.arch }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always() && matrix.platform == 'linux/amd64'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Fail on fixable CRITICAL findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan-${{ steps.prep.outputs.arch }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # Only runs once every platform passed its scan, so an image that failed a
  # gate never reaches the registry. The layers are already in the buildx cache
  # from the scan jobs, so this is a push rather than a rebuild.
  push:
    needs: scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned upstream version
        id: upstream
        run: |
          VERSION=$(tr -d '[:space:]' < .fork/upstream-version)
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Not a version: '$VERSION'" && exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp the upstream version into package.json and the lockfile
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.tmp
          mv package.tmp package.json
          jq --arg v "$VERSION" '.version = $v | .packages[""].version = $v' \
            package-lock.json > lock.tmp
          mv lock.tmp package-lock.json

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.upstream.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
